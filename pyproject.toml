[project]
name = "m3georeferencer"
version = "0.1.3"
description = "Georeferencing GUI built for Moon Mineralogy Mapper data"
authors = [
    {name = "Z.M. Vig",email = "zvig@umd.edu"}
]
license = {text = "LICENSE"}
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
    "numpy (>2.2)",
    "rasterio (>=1.4.3,<2.0.0)",
    "arguably (>=1.3.0)",
    "pyside6 (>=6.10.2,<7.0.0)",
    "pyqtgraph (>=0.14.0,<0.15.0)",
    "pyside6-stubs (>=6.7.3.0,<7.0.0.0)",
    "cmap (>=0.7.1,<0.8.0)",
    "pydantic (>=2.12.5,<3.0.0)",
    "fiona (>=1.10.1,<2.0.0)",
    "shapely (>=2.1.2,<3.0.0)",
    "xarray (>=2026.2.0,<2027.0.0)"
]

[project.scripts]
m3georeferencer = "m3georeferencer.app:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
